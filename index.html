<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Free AI quote organizer. Paste messy quotes and we identify sources, assign categories, and build your searchable collection. No signup required." />
    <meta name="keywords" content="quote organizer, AI quote identification, quote collection app, quote manager, Kindle highlights organizer, save quotes online" />
    <meta name="author" content="Degen Hill" />
    <meta name="application-name" content="Commonplace" />

    <link rel="canonical" href="https://commonplace.pro" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commonplace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Commonplace — Free AI Quote Organizer" />
    <meta property="og:description" content="Paste quotes in any format — AI identifies sources, assigns categories, and builds your searchable collection. Export as CSV, Markdown, or JSON. Free." />
    <meta property="og:url" content="https://commonplace.pro" />
    <meta property="og:image" content="https://commonplace.pro/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Commonplace turns messy pasted quotes into an organized collection with sources and categories" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commonplace — Free AI Quote Organizer" />
    <meta name="twitter:description" content="Paste quotes in any format — AI identifies sources, assigns categories, and builds your searchable collection. Free, no signup." />
    <meta name="twitter:image" content="https://commonplace.pro/og-image.png" />
    <meta name="twitter:image:alt" content="Commonplace turns messy pasted quotes into an organized collection with sources and categories" />

    <!-- Structured Data: WebSite + Organization (site name and logo in search
         results) and the app itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://commonplace.pro/#website",
          "url": "https://commonplace.pro",
          "name": "Commonplace",
          "alternateName": "Commonplace Quote Organizer",
          "inLanguage": "en",
          "publisher": { "@id": "https://commonplace.pro/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://commonplace.pro/#organization",
          "name": "Commonplace",
          "url": "https://commonplace.pro",
          "logo": {
            "@type": "ImageObject",
            "url": "https://commonplace.pro/icon-512.png",
            "width": 512,
            "height": 512
          },
          "founder": { "@id": "https://www.degenh.com/#person" },
          "sameAs": ["https://github.com/Degen11"]
        },
        {
          "@type": "Person",
          "@id": "https://www.degenh.com/#person",
          "name": "Degen Hill",
          "url": "https://www.degenh.com"
        },
        {
          "@type": "WebApplication",
          "@id": "https://commonplace.pro/#app",
          "name": "Commonplace",
          "url": "https://commonplace.pro",
          "description": "Free AI-powered quote organizer. Paste quotes in any format and we identify sources, assign categories, and build your searchable collection. Export as CSV, Markdown, or JSON.",
          "applicationCategory": "UtilitiesApplication",
          "applicationSubCategory": "Productivity",
          "operatingSystem": "Web",
          "browserRequirements": "Requires JavaScript. Works in Chrome, Firefox, Safari, and Edge.",
          "featureList": [
            "AI-powered quote source identification",
            "Local database of 3,700+ curated quotes",
            "Import from Kindle highlights, Readwise, CSV, JSON, Markdown",
            "Export as CSV, Markdown, or JSON",
            "Custom collections and categories",
            "Cloud sync across devices",
            "Duplicate detection",
            "Fuzzy search"
          ],
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "creator": { "@id": "https://www.degenh.com/#person" },
          "publisher": { "@id": "https://commonplace.pro/#organization" }
        }
      ]
    }
    </script>

    <!-- Structured Data: FAQ — generated at build time from src/data/faq.js
         (see the injectFaqJsonLd plugin in vite.config.js) so this JSON-LD
         and the visible FAQ section on the landing page can't drift apart. -->
    <script type="application/ld+json">
    <!--FAQ_JSONLD-->
    </script>

    <!-- Pre-paint boot: saved theme class, and hides the prerendered landing
         markup for returning visitors and shared links (see public/boot.js).
         Render-blocking on purpose; it's a few hundred bytes. -->
    <script src="/boot.js"></script>

    <!-- Fonts — self-hosted (public/fonts/), declared via @font-face in baseCSS
         (src/components/styles.js). No third-party font origin on the page
         anymore; preload the Satoshi weights used above the fold (Light is
         the hero subhead). -->
    <link rel="preload" href="/fonts/Satoshi-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- theme-color content is kept in sync with the in-app theme toggle by useTheme.js -->
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Commonplace — Free AI Quote Organizer</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- #root is filled with the prerendered landing page at build time
         (scripts/prerender.mjs), so crawlers and no-JS visitors get real content. -->
    <noscript>
      <p style="max-width:760px;margin:16px auto;padding:12px 24px;font-family:sans-serif;color:#1A1814;background:#F4EEDF;border-radius:6px">Commonplace needs JavaScript to organize quotes. Enable it to paste, import, and search your collection.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
