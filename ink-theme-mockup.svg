<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      text, tspan { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="#FAFAFA" />

  <!-- Top nav bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#E5E5E5" stroke-width="1" />

  <!-- Logo -->
  <text x="40" y="33" font-size="17" font-weight="600" fill="#171717" letter-spacing="-0.5">Commonplace</text>

  <!-- Search bar -->
  <rect x="340" y="12" width="300" height="28" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="356" y="30" font-size="12" fill="#A3A3A3">Search quotes...</text>

  <!-- Header buttons -->
  <rect x="880" y="12" width="70" height="28" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
  <text x="897" y="30" font-size="11" font-weight="500" fill="#525252">Export</text>

  <rect x="960" y="12" width="80" height="28" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
  <text x="975" y="30" font-size="11" font-weight="500" fill="#525252">Add more</text>

  <!-- Sync pill -->
  <rect x="1060" y="15" width="60" height="22" rx="3" fill="#F5F5F5" />
  <text x="1075" y="30" font-size="10" font-weight="500" fill="#A3A3A3">Synced</text>

  <!-- Stats bar -->
  <rect x="0" y="52" width="1200" height="36" fill="#FAFAFA" />
  <line x1="0" y1="88" x2="1200" y2="88" stroke="#E5E5E5" stroke-width="1" />
  <text x="40" y="75" font-size="13" font-weight="600" fill="#171717">24 quotes</text>
  <text x="120" y="75" font-size="12" fill="#A3A3A3">in 8 categories</text>

  <!-- Category filter pills — MONOCHROME (the key change) -->
  <rect x="340" y="60" width="36" height="22" rx="3" fill="#171717" />
  <text x="352" y="75" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="middle">All</text>

  <rect x="384" y="60" width="48" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="408" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Film</text>

  <rect x="440" y="60" width="48" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="464" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Book</text>

  <rect x="496" y="60" width="48" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="520" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Music</text>

  <rect x="552" y="60" width="56" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="580" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Speech</text>

  <rect x="616" y="60" width="42" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="637" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">TV</text>

  <rect x="666" y="60" width="52" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="692" y="75" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Poetic</text>

  <!-- Table header -->
  <rect x="0" y="88" width="1200" height="32" fill="#FAFAFA" />
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#E5E5E5" stroke-width="1" />
  <text x="60" y="108" font-size="11" font-weight="600" fill="#A3A3A3" letter-spacing="0.05em">QUOTE</text>
  <text x="780" y="108" font-size="11" font-weight="600" fill="#A3A3A3" letter-spacing="0.05em">SOURCE</text>
  <text x="1000" y="108" font-size="11" font-weight="600" fill="#A3A3A3" letter-spacing="0.05em">CATEGORY</text>

  <!-- Row 1 -->
  <rect x="0" y="120" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="172" x2="1200" y2="172" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="150" font-size="13" fill="#171717">"You can't handle the truth!"</text>
  <!-- Source in monospace -->
  <text x="780" y="150" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">A Few Good Men</text>
  <!-- Category pill — monochrome -->
  <rect x="1000" y="136" width="40" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1020" y="151" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Film</text>
  <!-- Confidence dot -->
  <circle cx="1120" cy="146" r="3" fill="#16A34A" />

  <!-- Row 2 — hovered state -->
  <rect x="0" y="172" width="1200" height="52" fill="#F9F9F9" />
  <line x1="0" y1="224" x2="1200" y2="224" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="202" font-size="13" fill="#171717">"The world breaks everyone, and afterward, many are strong at the broken places."</text>
  <text x="780" y="202" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">Ernest Hemingway</text>
  <rect x="1000" y="188" width="46" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1023" y="203" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Book</text>
  <circle cx="1120" cy="198" r="3" fill="#16A34A" />

  <!-- Row 3 -->
  <rect x="0" y="224" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="276" x2="1200" y2="276" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="254" font-size="13" fill="#171717">"Is this the real life? Is this just fantasy?"</text>
  <text x="780" y="254" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">Queen</text>
  <rect x="1000" y="240" width="50" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1025" y="255" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Music</text>
  <circle cx="1120" cy="250" r="3" fill="#16A34A" />

  <!-- Row 4 -->
  <rect x="0" y="276" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="328" x2="1200" y2="328" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="306" font-size="13" fill="#171717">"The only thing we have to fear is fear itself."</text>
  <text x="780" y="306" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">Franklin D. Roosevelt</text>
  <!-- Active category with accent color -->
  <rect x="1000" y="292" width="58" height="22" rx="3" fill="rgba(232,93,4,0.08)" stroke="rgba(232,93,4,0.25)" stroke-width="1" />
  <text x="1029" y="307" font-size="10" font-weight="500" fill="#E85D04" text-anchor="middle">Speech</text>
  <circle cx="1120" cy="302" r="3" fill="#16A34A" />

  <!-- Row 5 -->
  <rect x="0" y="328" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="358" font-size="13" fill="#171717">"Not all those who wander are lost."</text>
  <text x="780" y="358" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">J.R.R. Tolkien</text>
  <rect x="1000" y="344" width="46" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1023" y="359" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Book</text>
  <circle cx="1120" cy="354" r="3" fill="#D97706" />

  <!-- Row 6 -->
  <rect x="0" y="380" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="432" x2="1200" y2="432" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="410" font-size="13" fill="#171717">"I think, therefore I am."</text>
  <text x="780" y="410" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">Rene Descartes</text>
  <rect x="1000" y="396" width="80" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1040" y="411" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Philosophical</text>
  <circle cx="1120" cy="406" r="3" fill="#16A34A" />

  <!-- Row 7 -->
  <rect x="0" y="432" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="484" x2="1200" y2="484" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="462" font-size="13" fill="#171717">"Get busy living, or get busy dying."</text>
  <text x="780" y="462" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">The Shawshank Redemption</text>
  <rect x="1000" y="448" width="40" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1020" y="463" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">Film</text>
  <circle cx="1120" cy="458" r="3" fill="#16A34A" />

  <!-- Row 8 -->
  <rect x="0" y="484" width="1200" height="52" fill="#FFFFFF" />
  <line x1="0" y1="536" x2="1200" y2="536" stroke="#F0F0F0" stroke-width="1" />
  <text x="60" y="514" font-size="13" fill="#171717">"Winter is coming."</text>
  <text x="780" y="514" font-size="12" fill="#525252" font-family="'Geist Mono', 'SF Mono', monospace">Game of Thrones</text>
  <rect x="1000" y="500" width="32" height="22" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="1016" y="515" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">TV</text>
  <circle cx="1120" cy="510" r="3" fill="#16A34A" />

  <!-- ═══════════════════════════════════════════ -->
  <!-- ACCENT COLOR SHOWCASE — bottom section     -->
  <!-- ═══════════════════════════════════════════ -->

  <rect x="0" y="560" width="1200" height="290" fill="#F5F5F5" />
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#E5E5E5" stroke-width="1" />

  <!-- Section label -->
  <text x="40" y="595" font-size="14" font-weight="600" fill="#171717">Accent color used sparingly</text>
  <text x="40" y="615" font-size="12" fill="#A3A3A3">Burnt orange (#E85D04) only appears on interactive/active elements</text>

  <!-- Primary action button -->
  <rect x="40" y="640" width="140" height="36" rx="3" fill="#E85D04" />
  <text x="110" y="663" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Identify Quotes</text>

  <!-- Secondary button -->
  <rect x="200" y="640" width="100" height="36" rx="3" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
  <text x="250" y="663" font-size="13" font-weight="500" fill="#525252" text-anchor="middle">Export</text>

  <!-- Active filter pill with accent -->
  <rect x="320" y="644" width="70" height="28" rx="3" fill="rgba(232,93,4,0.08)" stroke="rgba(232,93,4,0.3)" stroke-width="1" />
  <text x="355" y="662" font-size="11" font-weight="500" fill="#E85D04" text-anchor="middle">Film (4)</text>

  <!-- Inactive filter pill -->
  <rect x="400" y="644" width="70" height="28" rx="3" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1" />
  <text x="435" y="662" font-size="11" font-weight="500" fill="#737373" text-anchor="middle">Book (3)</text>

  <!-- Count badge -->
  <rect x="490" y="648" width="22" height="20" rx="3" fill="#E85D04" />
  <text x="501" y="662" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">24</text>
  <text x="520" y="662" font-size="12" fill="#737373">quotes selected</text>

  <!-- Key design principles -->
  <text x="40" y="720" font-size="13" font-weight="600" fill="#171717">Design principles</text>

  <circle cx="52" cy="745" r="4" fill="#E85D04" />
  <text x="66" y="749" font-size="12" fill="#525252">Sharp corners (2-3px radius max) — no bubbly rounded shapes</text>

  <circle cx="52" cy="770" r="4" fill="#E85D04" />
  <text x="66" y="774" font-size="12" fill="#525252">Monospace source attributions — subtle visual distinction without color</text>

  <circle cx="52" cy="795" r="4" fill="#E85D04" />
  <text x="66" y="799" font-size="12" fill="#525252">Monochrome pills — color only on active/selected state (burnt orange)</text>

  <circle cx="52" cy="820" r="4" fill="#E85D04" />
  <text x="66" y="824" font-size="12" fill="#525252">Cool gray palette (#FAFAFA bg, not warm) — neutral ink-on-paper feel</text>

  <!-- Color swatches on right -->
  <text x="780" y="720" font-size="13" font-weight="600" fill="#171717">Palette</text>

  <rect x="780" y="735" width="30" height="30" rx="2" fill="#171717" />
  <text x="820" y="755" font-size="11" fill="#525252">#171717 — Text</text>

  <rect x="780" y="772" width="30" height="30" rx="2" fill="#525252" />
  <text x="820" y="792" font-size="11" fill="#525252">#525252 — Secondary</text>

  <rect x="780" y="809" width="30" height="30" rx="2" fill="#A3A3A3" />
  <text x="820" y="829" font-size="11" fill="#525252">#A3A3A3 — Muted</text>

  <rect x="980" y="735" width="30" height="30" rx="2" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1" />
  <text x="1020" y="755" font-size="11" fill="#525252">#FAFAFA — Background</text>

  <rect x="980" y="772" width="30" height="30" rx="2" fill="#E85D04" />
  <text x="1020" y="792" font-size="11" fill="#525252">#E85D04 — Accent</text>

  <rect x="980" y="809" width="30" height="30" rx="2" fill="#0A0A0A" />
  <text x="1020" y="829" font-size="11" fill="#525252">#0A0A0A — Dark mode bg</text>
</svg>