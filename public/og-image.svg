<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#3C5775"/>

  <!-- Book icon -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <g transform="translate(-24, -50) scale(2.2)">
      <path d="M16 7C13.5 5.5 10 5 7 5C5.5 5 4 5.8 4 7.5V23.5C4 25 5.5 25.5 7 25.5C10 25.5 13.5 26.2 16 28" stroke="#3C5775" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M16 7C18.5 5.5 22 5 25 5C26.5 5 28 5.8 28 7.5V23.5C28 25 26.5 25.5 25 25.5C22 25.5 18.5 26.2 16 28" stroke="#3C5775" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M16 7V28" stroke="#3C5775" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M21 5V14L23 12.5L25 14V5" fill="#3C5775" opacity="0.2" stroke="#3C5775" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="72" font-weight="700" fill="#1A1814" letter-spacing="-2">Commonplace</text>

  <!-- Accent underline -->
  <rect x="560" y="258" width="80" height="3" rx="1.5" fill="#3C5775"/>

  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="'DM Sans', Inter, sans-serif" font-size="24" fill="#6B6A67">Organize your messy quotes</text>

  <!-- Category pills -->
  <g>
    <rect x="270" y="350" width="100" height="40" rx="20" fill="#F3E8FF"/>
    <text x="320" y="376" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#7C3AED">Film</text>

    <rect x="390" y="350" width="100" height="40" rx="20" fill="#DCFCE7"/>
    <text x="440" y="376" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#16A34A">TV</text>

    <rect x="510" y="350" width="100" height="40" rx="20" fill="#FEF3C7"/>
    <text x="560" y="376" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#D97706">Book</text>

    <rect x="630" y="350" width="100" height="40" rx="20" fill="#FFE4E6"/>
    <text x="680" y="376" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#E11D48">Music</text>

    <rect x="750" y="350" width="110" height="40" rx="20" fill="#E0F2FE"/>
    <text x="805" y="376" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#0284C7">Speech</text>
  </g>

  <!-- Workflow -->
  <text font-family="'DM Sans', sans-serif" font-size="20" font-weight="500" text-anchor="middle" y="470">
    <tspan x="600" fill="#3C5775">Paste</tspan>
    <tspan fill="#C8C4BC">  &#x2192;  </tspan>
    <tspan fill="#3C5775">Identify</tspan>
    <tspan fill="#C8C4BC">  &#x2192;  </tspan>
    <tspan fill="#3C5775">Organize</tspan>
  </text>

  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" font-family="'DM Mono', monospace" font-size="16" fill="#9B9A97" letter-spacing="1">commonplace.pro</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="#3C5775"/>
