<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="4" fill="#3C5775"/>
  
  <!-- Title with Playfair Display -->
  <text x="600" y="200" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="80" font-weight="700" fill="#1A1814" letter-spacing="-2">Commonplace</text>
  
  <!-- Subtitle -->
  <text x="600" y="270" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="24" fill="#9B9A97">Organize your quote collection</text>
  
  <!-- Main source categories - perfectly centered -->
  <rect x="250" y="330" width="100" height="36" rx="18" fill="#F3E8FF"/>
  <text x="300" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#7C3AED">Film</text>
  
  <rect x="375" y="330" width="100" height="36" rx="18" fill="#DCFCE7"/>
  <text x="425" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#16A34A">TV</text>
  
  <rect x="500" y="330" width="100" height="36" rx="18" fill="#FEF3C7"/>
  <text x="550" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#D97706">Book</text>
  
  <rect x="625" y="330" width="100" height="36" rx="18" fill="#FFE4E6"/>
  <text x="675" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#E11D48">Music</text>
  
  <rect x="750" y="330" width="100" height="36" rx="18" fill="#E0F2FE"/>
  <text x="800" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0284C7">Speech</text>
  
  <rect x="875" y="330" width="100" height="36" rx="18" fill="#F1F0FF"/>
  <text x="925" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6366F1">Phrase</text>

  <!-- Description with blue accent -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="18" fill="#3C5775" font-weight="500">Paste messy quotes → AI identifies sources → Export organized</text>
  
  <!-- Bottom accent -->
  <rect x="540" y="500" width="120" height="3" rx="1.5" fill="#3C5775"/>
</svg>