<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Free AI quote organizer. Paste messy quotes and we identify sources, assign categories, and build your searchable collection. No signup required." />
    <meta name="keywords" content="quote organizer, AI quote identification, quote collection app, quote manager, Kindle highlights organizer, save quotes online" />
    <meta name="author" content="Degen Hill" />
    <meta name="application-name" content="Commonplace" />

    <link rel="canonical" href="https://commonplace.pro" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commonplace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Commonplace — Free AI Quote Organizer" />
    <meta property="og:description" content="Paste quotes in any format — AI identifies sources, assigns categories, and builds your searchable collection. Export as CSV, Markdown, or JSON. Free." />
    <meta property="og:url" content="https://commonplace.pro" />
    <meta property="og:image" content="https://commonplace.pro/api/og" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commonplace — Free AI Quote Organizer" />
    <meta name="twitter:description" content="Paste quotes in any format — AI identifies sources, assigns categories, and builds your searchable collection. Free, no signup." />
    <meta name="twitter:image" content="https://commonplace.pro/api/og" />

    <!-- Structured Data: Software Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["SoftwareApplication", "WebApplication"],
      "name": "Commonplace",
      "url": "https://commonplace.pro",
      "description": "Free AI-powered quote organizer. Paste quotes in any format and we identify sources, assign categories, and build your searchable collection. Export as CSV, Markdown, or JSON.",
      "applicationCategory": "UtilitiesApplication",
      "applicationSubCategory": "Productivity",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript. Works in Chrome, Firefox, Safari, and Edge.",
      "featureList": [
        "AI-powered quote source identification",
        "Local database of 3,700+ curated quotes",
        "Import from Kindle highlights, Readwise, CSV, JSON, Markdown",
        "Export as CSV, Markdown, or JSON",
        "Custom collections and categories",
        "Cloud sync across devices",
        "Duplicate detection",
        "Fuzzy search"
      ],
      "screenshot": "https://commonplace.pro/api/og",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Person",
        "name": "Degen Hill",
        "url": "https://www.degenh.com"
      }
    }
    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Commonplace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Commonplace is a free AI-powered quote organizer. Paste quotes in any format and it identifies the sources, assigns categories, and builds a searchable collection you can export as CSV, Markdown, or JSON."
          }
        },
        {
          "@type": "Question",
          "name": "Is Commonplace free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Commonplace is completely free. No account, subscription, or payment is required."
          }
        },
        {
          "@type": "Question",
          "name": "How does AI quote identification work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Commonplace first checks a local database of 3,700+ curated quotes for instant matches. Unmatched quotes are looked up via Wikiquote and Open Library, then identified by Claude AI (by Anthropic) as a final fallback."
          }
        },
        {
          "@type": "Question",
          "name": "What file formats can I import?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Commonplace supports .txt, .csv, .json, and .md files, including exports from Kindle highlights, Readwise, Notion, and similar apps. You can also import quotes directly from a URL."
          }
        },
        {
          "@type": "Question",
          "name": "How do I export my quote collection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Export your collection as CSV, Markdown, or JSON. These formats are compatible with Notion, Obsidian, Roam Research, and other note-taking tools."
          }
        },
        {
          "@type": "Question",
          "name": "Is my quote data private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your quotes are stored locally in your browser's local storage by default. No account is required and no personal data is collected. Cloud sync is optional and uses an anonymous device ID — no email or login needed."
          }
        }
      ]
    }
    </script>

    <!-- Fonts — render-blocking stylesheets; display=swap avoids invisible text while loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- theme-color content is kept in sync with the in-app theme toggle by useTheme.js -->
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Commonplace — Free AI Quote Organizer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:760px;margin:0 auto;padding:40px 24px;font-family:sans-serif;color:#1A1814;line-height:1.7">
        <h1 style="font-size:2rem;margin-bottom:12px">Commonplace — Free AI Quote Organizer</h1>
        <p style="font-size:1.1rem;margin-bottom:24px">Paste your messy quotes, phrases, and fragments. Commonplace identifies the sources, assigns categories, and builds your searchable collection. Free. No signup required.</p>
        <h2 style="font-size:1.25rem;margin-bottom:12px">Features</h2>
        <ul style="margin-bottom:24px">
          <li>AI identifies quote sources from a local database of 3,700+ curated quotes</li>
          <li>Import from Kindle highlights, Readwise, CSV, JSON, and Markdown files</li>
          <li>Export as CSV, Markdown, or JSON — compatible with Notion and Obsidian</li>
          <li>Custom collections, categories, and drag-to-reorder</li>
          <li>Cloud sync across devices with no account required</li>
          <li>Private: your data stays in your browser by default</li>
        </ul>
        <h2 style="font-size:1.25rem;margin-bottom:12px">How it works</h2>
        <ol style="margin-bottom:24px">
          <li>Paste or import your quotes in any format</li>
          <li>AI identifies sources and assigns categories automatically</li>
          <li>Search, filter, edit, and organize your collection</li>
          <li>Export to your preferred format</li>
        </ol>
        <p><strong>Enable JavaScript to start organizing your quote collection at <a href="https://commonplace.pro">commonplace.pro</a>.</strong></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
