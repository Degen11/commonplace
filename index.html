<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Commonplace — Paste your messy quotes, phrases, and fragments. We'll organize everything and identify the sources." />

    <link rel="canonical" href="https://commonplace.pro" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commonplace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Commonplace — Organize your quote collection" />
    <meta property="og:description" content="Paste your messy quotes, phrases, and fragments. AI identifies sources and organizes everything. Export as CSV, Markdown, or JSON." />
    <meta property="og:url" content="https://commonplace.pro" />
    <meta property="og:image" content="https://commonplace.pro/api/og" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commonplace — Organize your quote collection" />
    <meta name="twitter:description" content="Paste your messy quotes, phrases, and fragments. AI identifies sources and organizes everything." />
    <meta name="twitter:image" content="https://commonplace.pro/api/og" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Commonplace",
      "url": "https://commonplace.pro",
      "description": "Paste your messy quotes, phrases, and fragments. AI identifies sources and organizes everything. Export as CSV, Markdown, or JSON.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Commonplace",
        "url": "https://commonplace.pro"
      }
    }
    </script>

    <!-- Font: non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Commonplace — Organize your quote collection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
